name: AKShare forward-adjusted data probe
on:
  workflow_dispatch:
    inputs:
      expected_date:
        description: Expected completed trading date (YYYY-MM-DD)
        required: true
      sample_size:
        description: Number of SH/SZ symbols (20 to 100)
        required: true
        default: '100'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare==1.18.35
      - name: Restore stock-list snapshot (history is not used by probe)
        uses: actions/cache/restore@v4
        with:
          path: .cache/
          key: tushare-daily-${{ runner.os }}-probe-${{ github.run_id }}
          restore-keys: |
            tushare-daily-${{ runner.os }}-
      - name: Test two uncached passes, no retries
        run: python scripts/akshare_probe.py
        env:
          EXPECTED_DATE: ${{ inputs.expected_date }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akshare-probe-report
          path: akshare-probe-*.json
